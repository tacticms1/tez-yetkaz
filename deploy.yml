name: TezYetkaz CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/tez-yetkaz

jobs:
  # ===== JOB 1: TEST =====
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Node.js 18 o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Backend bog'liqliklarini o'rnatish
        run: cd backend && npm install

      - name: Testlarni ishlatish
        run: cd backend && npm test --if-present

      - name: Frontend bog'liqliklarini o'rnatish
        run: cd frontend && npm install

  # ===== JOB 2: BUILD DOCKER =====
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Docker Hub ga kirish
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Backend Docker image yaratish
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}-backend:latest ./backend
          docker build -t ${{ env.DOCKER_IMAGE }}-backend:${{ github.sha }} ./backend

      - name: Frontend Docker image yaratish
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}-frontend:latest ./frontend
          docker build -t ${{ env.DOCKER_IMAGE }}-frontend:${{ github.sha }} ./frontend

      - name: Docker Hub ga yuklash
        run: |
          docker push ${{ env.DOCKER_IMAGE }}-backend:latest
          docker push ${{ env.DOCKER_IMAGE }}-backend:${{ github.sha }}
          docker push ${{ env.DOCKER_IMAGE }}-frontend:latest
          docker push ${{ env.DOCKER_IMAGE }}-frontend:${{ github.sha }}

  # ===== JOB 3: DEPLOY TO AWS EC2 =====
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: AWS EC2 ga deploy qilish
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/tez-yetkaz/nginx
            cd ~/tez-yetkaz
            
            # Port 80 ni bo'shatish (agar biror narsa ishlayotgan bo'lsa)
            sudo fuser -k 80/tcp || true
            sudo systemctl stop nginx || true
            sudo systemctl stop apache2 || true

            # Nginx konfiguratsiyasini yaratish
            cat > nginx/nginx.conf << 'EOF'
            events { worker_connections 1024; }
            http {
                include       /etc/nginx/mime.types;
                default_type  application/octet-stream;
                server {
                    listen 80;
                    location / {
                        proxy_pass http://frontend:80;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                    }
                    location /api/ {
                        proxy_pass http://backend:5000/;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                    }
                    location /health {
                        access_log off;
                        return 200 '{"status":"healthy"}';
                        add_header Content-Type application/json;
                    }
                }
            }
            EOF

            # Docker Compose faylini yaratish
            cat > docker-compose.yml << 'EOF'
            version: '3.8'
            networks:
              tez-yetkaz-network:
                driver: bridge
            services:
              backend:
                image: ${{ secrets.DOCKER_USERNAME }}/tez-yetkaz-backend:latest
                container_name: tez-yetkaz-backend
                environment:
                  DATABASE_URL: "${{ secrets.DATABASE_URL }}"
                  PORT: 5000
                  NODE_ENV: production
                networks:
                  - tez-yetkaz-network
                restart: unless-stopped
              frontend:
                image: ${{ secrets.DOCKER_USERNAME }}/tez-yetkaz-frontend:latest
                container_name: tez-yetkaz-frontend
                networks:
                  - tez-yetkaz-network
                restart: unless-stopped
              nginx:
                image: nginx:alpine
                container_name: tez-yetkaz-nginx
                ports:
                  - "80:80"
                volumes:
                  - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
                depends_on:
                  - backend
                  - frontend
                networks:
                  - tez-yetkaz-network
                restart: unless-stopped
            EOF
            
            # Server firewall-ni ochish
            sudo ufw allow 80/tcp || true
            
            # Konteynerlarni yangilash va ishga tushirish
            docker-compose pull
            docker-compose up -d --remove-orphans
            
            # Holatni tekshirish
            echo "--- Konteynerlar holati ---"
            docker ps
            sleep 10
            docker-compose logs nginx
            echo "✅ TezYetkaz muvaffaqiyatli deploy qilindi!"

      - name: Health check
        run: |
          echo "Waiting for service to be ready..."
          sleep 30
          curl -v http://${{ secrets.EC2_HOST }}/health || (echo "❌ Health check failed!" && exit 1)
          echo "✅ Health check muvaffaqiyatli!"
