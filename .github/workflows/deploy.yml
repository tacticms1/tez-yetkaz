name: TezYetkaz CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/tez-yetkaz

jobs:
  # ===== JOB 1: TEST =====
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Node.js 22 o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Backend bog'liqliklarini o'rnatish
        run: |
          cd backend
          npm install

      - name: Frontend bog'liqliklarini o'rnatish
        run: |
          cd frontend
          npm install

  # ===== JOB 2: BUILD DOCKER =====
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Docker Hub ga kirish
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Backend Docker image yaratish
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}-backend:latest ./backend
          docker push ${{ env.DOCKER_IMAGE }}-backend:latest

      - name: Frontend Docker image yaratish
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}-frontend:latest ./frontend
          docker push ${{ env.DOCKER_IMAGE }}-frontend:latest

  # ===== JOB 3: DEPLOY TO AWS EC2 =====
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: AWS EC2 ga deploy qilish
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Docker o'rnatilganini tekshirish
            if ! command -v docker &> /dev/null; then
              sudo apt update && sudo apt install docker.io docker-compose -y
              sudo usermod -aG docker $USER
            fi

            mkdir -p ~/tez-yetkaz
            cd ~/tez-yetkaz
            
            # Portlarni bo'shatish
            sudo fuser -k 80/tcp || true
            sudo fuser -k 5000/tcp || true

            # Docker-compose faylini yaratish
            cat > docker-compose.yml << 'EOF'
            version: '3.8'
            services:
              backend:
                image: ${{ secrets.DOCKER_USERNAME }}/tez-yetkaz-backend:latest
                container_name: tez-yetkaz-backend
                ports:
                  - "5000:5000"
                environment:
                  DATABASE_URL: "${{ secrets.DATABASE_URL }}"
                  PORT: 5000
                  NODE_ENV: production
                restart: always
              frontend:
                image: ${{ secrets.DOCKER_USERNAME }}/tez-yetkaz-frontend:latest
                container_name: tez-yetkaz-frontend
                ports:
                  - "80:80"
                restart: always
            EOF
            
            # Docker Hub login va ishga tushirish
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            docker-compose pull
            docker-compose up -d --remove-orphans
            
            echo "--- Konteynerlar holati ---"
            docker ps
            echo "--- Backend Loglari ---"
            docker logs tez-yetkaz-backend --tail 30

      - name: Health check
        run: |
          echo "Waiting for service (60 seconds)..."
          sleep 60
          echo "Checking Frontend (Port 80)..."
          curl -v http://${{ secrets.EC2_HOST }} || (echo "❌ Sayt hali ishga tushmadi!" && exit 1)
          echo "✅ Hammasi muvaffaqiyatli ishga tushdi!"
