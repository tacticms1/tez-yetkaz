name: TezYetkaz CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/tez-yetkaz

jobs:
  # ===== JOB 1: TEST =====
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Node.js 22 o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Backend bog'liqliklarini o'rnatish
        run: |
          cd backend
          npm install

      - name: Frontend bog'liqliklarini o'rnatish
        run: |
          cd frontend
          npm install

  # ===== JOB 2: BUILD DOCKER =====
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Docker Hub ga kirish
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Backend Docker image yaratish
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}-backend:latest ./backend
          docker push ${{ env.DOCKER_IMAGE }}-backend:latest

      - name: Frontend Docker image yaratish
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}-frontend:latest ./frontend
          docker push ${{ env.DOCKER_IMAGE }}-frontend:latest

  # ===== JOB 3: DEPLOY TO AWS EC2 =====
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: AWS EC2 ga deploy qilish
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            # 1. Docker va Docker Compose (V2) o'rnatilganini tekshirish
            if ! command -v docker &> /dev/null; then
              sudo apt update && sudo apt install docker.io -y
              sudo usermod -aG docker $USER
            fi
            
            # Docker Compose V2 pluginini o'rnatish (agar yo'q bo'lsa)
            if ! docker compose version &> /dev/null; then
              sudo apt update && sudo apt install docker-compose-v2 -y
            fi

            mkdir -p ~/tez-yetkaz
            cd ~/tez-yetkaz
            
            # 2. Portlarni bo'shatish va Firewall tekshirish
            echo "--- Firewall holati ---"
            sudo ufw status || echo "ufw not installed"
            sudo iptables -L -n | grep :80 || echo "No iptables rule for port 80"
            
            sudo fuser -k 80/tcp || true
            sudo fuser -k 5000/tcp || true

            # 3. Docker-compose faylini yaratish
            cat > docker-compose.yml << 'EOF'
            version: '3.8'
            services:
              backend:
                image: ${{ secrets.DOCKER_USERNAME }}/tez-yetkaz-backend:latest
                container_name: tez-yetkaz-backend
                ports:
                  - "5000:5000"
                environment:
                  DATABASE_URL: "${{ secrets.DATABASE_URL }}"
                  PORT: 5000
                  NODE_ENV: production
                restart: always
                healthcheck:
                  test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
                  interval: 10s
                  timeout: 5s
                  retries: 5
              frontend:
                image: ${{ secrets.DOCKER_USERNAME }}/tez-yetkaz-frontend:latest
                container_name: tez-yetkaz-frontend
                ports:
                  - "80:80"
                restart: always
                depends_on:
                  backend:
                    condition: service_healthy
            EOF
            
            # 4. Docker Hub bilan bog'liq tarmoqni tekshirish
            echo "--- Tarmoq ulanishini tekshirish ---"
            ping -c 1 8.8.8.8 || echo "❌ Internetga ulanish yo'q (Ping failed)"
            getent hosts registry-1.docker.io || echo "❌ DNS registry-1.docker.io ni yecha olmadi"
            cat /etc/resolv.conf || true
            python3 - << 'PY'
            import socket, ssl

            host = "registry-1.docker.io"
            port = 443

            print("--- Python DNS/TCP/TLS diagnostika ---")
            try:
                infos = socket.getaddrinfo(host, port, type=socket.SOCK_STREAM)
                addrs = sorted({info[4][0] for info in infos})
                print("DNS OK:", ", ".join(addrs))
            except Exception as e:
                print("DNS ERROR:", repr(e))
                raise SystemExit(0)

            for addr in addrs[:3]:
                print(f"Testing TCP -> {addr}:{port}")
                try:
                    raw = socket.create_connection((addr, port), timeout=10)
                    print("TCP OK")
                except Exception as e:
                    print("TCP ERROR:", repr(e))
                    continue

                try:
                    ctx = ssl.create_default_context()
                    with ctx.wrap_socket(raw, server_hostname=host) as s:
                        print("TLS OK:", s.version())
                except Exception as e:
                    print("TLS ERROR:", repr(e))
            PY
            curl -I --max-time 20 https://registry-1.docker.io/v2/ || echo "❌ Docker Registry-ga ulanib bo'lmadi"
            docker info || true
            docker version || true
            journalctl -u docker --no-pager -n 50 || true

            docker_login_with_retry() {
              local attempt=1

              while [ "$attempt" -le 3 ]; do
                echo "--- Docker login (attempt ${attempt}/3) ---"
                if echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin; then
                  return 0
                fi

                echo "⚠️ Docker login muvaffaqiyatsiz tugadi"
                journalctl -u docker --no-pager -n 30 || true
                if [ "$attempt" -lt 3 ]; then
                  echo "--- Docker servis restart qilinmoqda ---"
                  sudo systemctl restart docker || true
                  sleep 10
                fi

                attempt=$((attempt + 1))
              done

              return 1
            }

            # 5. Docker Hub-ga login qilish
            docker_login_with_retry

            pull_with_retry() {
              local image="$1"
              local attempt=1

              while [ "$attempt" -le 3 ]; do
                echo "--- Pulling ${image} (attempt ${attempt}/3) ---"
                if docker pull "$image"; then
                  return 0
                fi

                echo "⚠️ Pull muvaffaqiyatsiz tugadi: ${image}"
                if [ "$attempt" -lt 3 ]; then
                  echo "--- Docker servis restart qilinmoqda ---"
                  sudo systemctl restart docker || true
                  sleep 10
                fi

                attempt=$((attempt + 1))
              done

              return 1
            }

            pull_with_retry "${{ secrets.DOCKER_USERNAME }}/tez-yetkaz-backend:latest"
            pull_with_retry "${{ secrets.DOCKER_USERNAME }}/tez-yetkaz-frontend:latest"

            docker compose up -d --pull never --remove-orphans
            
            echo "--- Konteynerlar holati ---"
            docker ps -a
            echo "--- Frontend Loglari ---"
            docker logs tez-yetkaz-frontend --tail 50 || true
            echo "--- Backend Loglari ---"
            docker logs tez-yetkaz-backend --tail 50 || true

      - name: Health check
        run: |
          echo "Waiting for service (60 seconds max)..."
          for i in {1..12}; do
            if curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }} | grep -q "200"; then
              echo "✅ Hammasi muvaffaqiyatli ishga tushdi!"
              exit 0
            fi
            echo "Waiting... ($((i*5)) seconds)"
            sleep 5
          done
          echo "❌ Sayt hali ishga tushmadi! (Timeout)"
          curl -v http://${{ secrets.EC2_HOST }} || true
          exit 1
