version: '3.8'

networks:
  tez-yetkaz-network:
    driver: bridge

services:
  # Backend API
  backend:
    image: ibrohim1454/tez-yetkaz-backend:latest
    container_name: tez-yetkaz-backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 5000
      NODE_ENV: production
      INSTANCE_ID: backend-1
    networks:
      - tez-yetkaz-network
    restart: unless-stopped

  # Nginx Load Balancer + Frontend
  nginx:
    image: nginx:alpine
    container_name: tez-yetkaz-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - tez-yetkaz-network
    restart: unless-stopped

  # React Frontend
  frontend:
    image: ibrohim1454/tez-yetkaz-frontend:latest
    container_name: tez-yetkaz-frontend
    networks:
      - tez-yetkaz-network
    restart: unless-stopped
